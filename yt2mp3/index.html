<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DripSwitch Studio — YouTube & YouTube Music to MP3</title>
  <meta name="description" content="Extract high-quality 320kbps MP3 audio from any YouTube or YouTube Music URL instantly.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/yt2mp3/style.css">
</head>
<body>

  <div class="container">
    
    <header>
      <div style="width: 56px; height: 56px; margin-bottom: 2px;">
        <img src="/yt2mp3/logo.svg" alt="DripSwitch Logo" style="width: 100%; height: 100%;" />
      </div>
      <div class="logo-badge">DripSwitch Studio</div>
      <h1>YouTube & YouTube Music to MP3</h1>
      <p class="subtitle">Extract high-quality 320kbps MP3 audio from any YouTube or YouTube Music link instantly.</p>
    </header>

    <div class="card">
      
      <div class="input-group">
        <input type="text" id="ytUrlInput" placeholder="Paste YouTube or YouTube Music URL (music.youtube.com)...">
        <button class="convert-btn" onclick="convertYouTubeToMp3()">
          <img src="/yt2mp3/icon_convert.svg" alt="" style="width: 16px; height: 16px; filter: brightness(10);" /> Convert to MP3
        </button>
      </div>

      <!-- Loading State -->
      <div class="loader-box" id="loaderBox">
        <div class="spinner"></div>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Extracting audio stream & generating MP3 file...</p>
      </div>

      <!-- Result Card -->
      <div class="result-box" id="resultBox">
        <div class="track-preview">
          <img src="" alt="Thumbnail" class="track-thumb" id="trackThumb">
          <div class="track-info">
            <h3 class="track-title" id="trackTitle">Audio Track</h3>
            <p class="track-meta" id="trackUploader">Creator: YouTube Music</p>
            <span style="font-size: 0.72rem; color: var(--color-sage); font-weight: 700;">● 320kbps MP3 Audio Ready</span>
          </div>
        </div>

        <!-- Custom Audio Player Deck with Interactive Scrubber -->
        <div class="player-deck">
          <audio id="audioPlayer" preload="auto"></audio>
          
          <div class="player-controls">
            <button type="button" class="play-pause-btn" id="playPauseBtn" onclick="togglePlayPause()">
              <span id="playIcon">▶</span>
            </button>

            <div class="scrubber-wrapper">
              <input type="range" class="audio-scrubber" id="audioScrubber" min="0" max="100" value="0" step="0.1" oninput="seekAudio(this.value)">
              <div class="time-display">
                <span id="currentTimeDisplay">0:00</span>
                <span id="totalTimeDisplay">0:00</span>
              </div>
            </div>
          </div>
        </div>

        <a href="" id="downloadBtn" download class="download-btn">
          <img src="/yt2mp3/icon_download.svg" alt="" style="width: 18px; height: 18px;" /> Download MP3 Audio File
        </a>
      </div>

    </div>

  </div>

  <script src="/yt2mp3/app.js"></script>
</body>
</html>
