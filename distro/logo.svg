<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <path id="textArc" d="M 110 220 A 150 150 0 0 1 390 220" fill="none" />
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48e5c2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#48e5c2" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Arched Text SOUNDDROP -->
  <text font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="44" fill="#6ee7b7" letter-spacing="8">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">SOUNDDROP</textPath>
  </text>

  <!-- Outer Ring -->
  <circle cx="250" cy="270" r="115" stroke="#6ee7b7" stroke-width="3.5" fill="none" />

  <!-- Multi-layer Soundwaves -->
  <path d="M 60 270 Q 140 230 200 270 T 310 270 T 440 270 Q 360 310 300 270 T 190 270 Z" fill="url(#waveGrad2)" />
  <path d="M 80 270 Q 150 240 220 270 T 330 270 T 420 270 Q 340 300 270 270 T 170 270 Z" fill="url(#waveGrad)" />
</svg>
